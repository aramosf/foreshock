# Alembic config — Foreshock
# La URL real la inyecta migrations/env.py desde la env var DATABASE_URL
# (siempre prioritaria). Este valor es un placeholder NO funcional: no pongas
# credenciales reales aquí; exporta DATABASE_URL antes de migrar, p.ej.:
#   export DATABASE_URL=postgresql+psycopg://usuario:password@localhost:5432/foreshock
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = postgresql+psycopg://SET_DATABASE_URL_ENV@localhost:5432/foreshock

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
