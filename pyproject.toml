[project]
name = "foreshock"
version = "0.1.0"
description = "Foreshock — radar temprano de vulnerabilidades"
requires-python = ">=3.12"
dependencies = [
    # DB / migraciones
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    # config / validación / logging
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    # red / parseo
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "selectolax>=0.3",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
    # scheduling / cache / colas
    "apscheduler>=3.10",
    "redis>=5.0",
    # scoring
    "cvss>=3.2",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
foreshock = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

# Playwright es opcional (imagen pesada); solo para fetchers method=browser.
[project.optional-dependencies]
browser = [
    "playwright>=1.47",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
