# Password de Postgres parametrizada: exporta POSTGRES_PASSWORD (o ponla en
# .env) — el default 'foreshock' es SOLO para desarrollo local. En producción
# fija un valor fuerte ANTES del primer arranque (el volumen pgdata conserva
# la password inicial).
x-database-url: &database-url postgresql+psycopg://foreshock:${POSTGRES_PASSWORD:-foreshock}@postgres:5432/foreshock

# Nombre de proyecto FIJO: contenedores/volúmenes/imágenes se llaman foreshock-*
# independientemente del nombre del directorio.
name: foreshock

services:
  postgres:
    image: postgres:16
    mem_limit: ${FORESHOCK_POSTGRES_MEM_LIMIT:-8g}
    pids_limit: ${FORESHOCK_POSTGRES_PIDS_LIMIT:-256}
    # /dev/shm es donde PostgreSQL pone la memoria dinámica compartida de los
    # workers paralelos. El default de Docker (64 MiB) se queda corto: un
    # `VACUUM (ANALYZE) published_cves` (9 índices, 2 workers de mantenimiento)
    # falla con «could not resize shared memory segment ... No space left on
    # device», y las consultas paralelas degradan por lo mismo.
    shm_size: ${FORESHOCK_POSTGRES_SHM_SIZE:-1gb}
    environment:
      POSTGRES_USER: foreshock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foreshock}
      POSTGRES_DB: foreshock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foreshock -d foreshock"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Aplica las migraciones Alembic y termina. El resto de servicios
  # esperan a que este acabe con éxito (service_completed_successfully).
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    mem_limit: ${FORESHOCK_MIGRATE_MEM_LIMIT:-1g}
    pids_limit: ${FORESHOCK_MIGRATE_PIDS_LIMIT:-64}
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # ---- Workers de carga de datos ----
  baseline-worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    init: true
    mem_limit: ${FORESHOCK_BASELINE_MEM_LIMIT:-3g}
    pids_limit: ${FORESHOCK_BASELINE_PIDS_LIMIT:-96}
    environment:
      DATABASE_URL: *database-url
      FORESHOCK_DATA_DIR: /data
      FORESHOCK_RAW_HTML_DIR: /data/raw
      FORESHOCK_CVELIST_REPO_DIR: /data/cvelistV5
      FORESHOCK_NVD_API_KEY: ${FORESHOCK_NVD_API_KEY:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - data:/data
    command: ["python", "-m", "app.baseline"]
    restart: unless-stopped

  sources-worker:
    build: { context: ., dockerfile: docker/Dockerfile }
    init: true
    mem_limit: ${FORESHOCK_SOURCES_MEM_LIMIT:-4g}
    pids_limit: ${FORESHOCK_SOURCES_PIDS_LIMIT:-128}
    environment:
      DATABASE_URL: *database-url
      FORESHOCK_DATA_DIR: /data
      FORESHOCK_RAW_HTML_DIR: /data/raw
      # start.sh --full-load lanza `foreshock baseline nvd-full` en este
      # contenedor: sin la API key el full sync va a ritmo anónimo (lentísimo).
      FORESHOCK_NVD_API_KEY: ${FORESHOCK_NVD_API_KEY:-}
      FORESHOCK_LLM_PROVIDER: ${FORESHOCK_LLM_PROVIDER:-mock}
      FORESHOCK_LLM_API_KEY: ${FORESHOCK_LLM_API_KEY:-}
      FORESHOCK_LLM_MODEL: ${FORESHOCK_LLM_MODEL:-mock-model}
      FORESHOCK_GITHUB_TOKEN: ${FORESHOCK_GITHUB_TOKEN:-}
      FORESHOCK_GITHUB_TOP_N: ${FORESHOCK_GITHUB_TOP_N:-1000}
      FORESHOCK_GITHUB_REPOS_PER_RUN: ${FORESHOCK_GITHUB_REPOS_PER_RUN:-1000}
      FORESHOCK_GITHUB_REPO_SCAN_PER_RUN: ${FORESHOCK_GITHUB_REPO_SCAN_PER_RUN:-2000}
      # Watchlist opt-in: radio de impacto (top PyPI por descargas -> repo) y
      # OpenSSF Criticality (CSV externo). El CSV oficial de OpenSSF está hoy tras
      # requester-pays/congelado; dejar la URL vacía hasta tener una fuente libre.
      FORESHOCK_PYPI_DOWNLOADS_TOP_N: ${FORESHOCK_PYPI_DOWNLOADS_TOP_N:-0}
      FORESHOCK_CRITICALITY_CSV_URL: ${FORESHOCK_CRITICALITY_CSV_URL:-}
      FORESHOCK_CRITICALITY_TOP_N: ${FORESHOCK_CRITICALITY_TOP_N:-2000}
      FORESHOCK_SOURCES_MAX_CONCURRENT: ${FORESHOCK_SOURCES_MAX_CONCURRENT:-4}
      FORESHOCK_SOURCES_GIT_MAX_CONCURRENT: ${FORESHOCK_SOURCES_GIT_MAX_CONCURRENT:-1}
      FORESHOCK_SOURCES_HEAVY_MAX_CONCURRENT: ${FORESHOCK_SOURCES_HEAVY_MAX_CONCURRENT:-1}
      FORESHOCK_SOURCES_STARTUP_SPREAD_SECONDS: ${FORESHOCK_SOURCES_STARTUP_SPREAD_SECONDS:-3600}
      FORESHOCK_VULNCHECK_TOKEN: ${FORESHOCK_VULNCHECK_TOKEN:-}
      FORESHOCK_VULNCHECK_MAX_PAGES: ${FORESHOCK_VULNCHECK_MAX_PAGES:-50}
      FORESHOCK_WORDFENCE_API_KEY: ${FORESHOCK_WORDFENCE_API_KEY:-}
      FORESHOCK_OSV_ECOSYSTEMS: ${FORESHOCK_OSV_ECOSYSTEMS:-PyPI,Go,crates.io,RubyGems,Packagist}
      FORESHOCK_OSV_MAX_PER_ECOSYSTEM: ${FORESHOCK_OSV_MAX_PER_ECOSYSTEM:-3000}
      FORESHOCK_OSV_MONTHS: ${FORESHOCK_OSV_MONTHS:-5}
      FORESHOCK_REDHAT_LOOKBACK_DAYS: ${FORESHOCK_REDHAT_LOOKBACK_DAYS:-3}
      FORESHOCK_GITHUB_COMMITS_MONTHS: ${FORESHOCK_GITHUB_COMMITS_MONTHS:-5}
      FORESHOCK_GITHUB_COMMITS_MAX_PAGES: ${FORESHOCK_GITHUB_COMMITS_MAX_PAGES:-10}
      FORESHOCK_CACHE_RAW: ${FORESHOCK_CACHE_RAW:-true}
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - data:/data
    command: ["python", "-m", "app.sources"]
    restart: unless-stopped

  # ---- API + frontend (dashboard) ----
  api:
    build: { context: ., dockerfile: docker/Dockerfile }
    mem_limit: ${FORESHOCK_API_MEM_LIMIT:-1g}
    pids_limit: ${FORESHOCK_API_PIDS_LIMIT:-64}
    environment:
      DATABASE_URL: *database-url
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      # /healthz hace SELECT 1 contra la BD; la imagen no trae curl -> urllib.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  data:
